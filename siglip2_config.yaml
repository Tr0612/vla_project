dataset_type: short_metaworld
data_root: data/short-metaworld-vla
train_jsonl: ""
val_jsonl: ""
val_ratio: 0.1

vision_model_name: google/siglip2-base-patch16-224
text_model_name: google/siglip2-base-patch16-224
image_size: 224
freeze_vision: true
freeze_text: true

# Fusion/projection
proj_dim: 512
normalize_embeddings: true

# Data
action_dim: 4
num_workers: 3

# Action scaling/normalization
normalize_action_targets: true
action_norm_eps: 1e-6
learnable_action_scale: true
action_scale_init: 1.0

# Optimization
epochs: 30
batch_size: 8
grad_accum_steps: 4
learning_rate: 1e-4
weight_decay: 1e-2
grad_clip_norm: 1.0
use_fp16: true

# Runtime
seed: 42
device: cuda
out_dir: checkpoints
save_best_by_val: true
